<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Registro de Usuario</h1>

    <form id="formRegistro" novalidate>
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="text" id="correo" name="correo" placeholder="correo@ejemplo.com">
        <span class="error" id="errorCorreo"></span>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">
        <span class="error" id="errorPassword"></span>
      </div>

      <button type="submit" id="btnRegistrar">Registrarse</button>
    </form>

    <p class="exito" id="mensajeExito"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
