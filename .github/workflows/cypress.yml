name: Pruebas Cypress

on:
  push:
  pull_request:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7

      - name: Instalar dependencias y ejecutar Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: chrome

      # Video de toda la corrida: se sube SIEMPRE (pase o falle)
      - name: Subir video de la corrida
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: warn

      # Capturas: solo se suben si alguna prueba FALLÓ
      - name: Subir capturas de pruebas fallidas
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
